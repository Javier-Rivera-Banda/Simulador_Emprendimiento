<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio Virtual de Emprendimiento · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#E9EEF7; --ink:#16224A; --muted:#55618A; --line:#D2DAEA;
  --primary:#2343B0; --primary-hover:#1A348F; --on-primary:#FFFFFF; --primary-soft:#E3E9FB;
  --accent:#F2A516; --accent-soft:#FFF2D3; --accent-ink:#7A4E00;
  --real:#0E8468; --real-bg:#DFF3EC; --sim:#6A4BC4; --sim-bg:#ECE6FB;
  --danger:#B53925; --danger-bg:#FBE7E2;
  --r-s:6px; --r-m:10px; --r-l:18px;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1430; --surface:#161E3F; --surface-2:#1F294F; --ink:#E7ECF8; --muted:#A0AACB; --line:#2F3B68;
    --primary:#88A2FF; --primary-hover:#A3B7FF; --on-primary:#0E1430; --primary-soft:#24305C;
    --accent:#F5B83D; --accent-soft:#3A2E12; --accent-ink:#F7CB72;
    --real:#43CBA4; --real-bg:#123630; --sim:#B29CF5; --sim-bg:#2A2453;
    --danger:#FF8C75; --danger-bg:#3D1E1A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1430; --surface:#161E3F; --surface-2:#1F294F; --ink:#E7ECF8; --muted:#A0AACB; --line:#2F3B68;
  --primary:#88A2FF; --primary-hover:#A3B7FF; --on-primary:#0E1430; --primary-soft:#24305C;
  --accent:#F5B83D; --accent-soft:#3A2E12; --accent-ink:#F7CB72;
  --real:#43CBA4; --real-bg:#123630; --sim:#B29CF5; --sim-bg:#2A2453;
  --danger:#FF8C75; --danger-bg:#3D1E1A; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0 0 .4em;letter-spacing:-.012em}
h1{font-size:clamp(1.9rem,3.4vw,2.6rem);font-weight:800}
h2{font-size:clamp(1.45rem,2.4vw,1.8rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--primary)}
img{max-width:100%}
.lead{font-size:1.08rem;color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:.9rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== Controles ===== */
.btn{font:inherit;font-weight:700;border-radius:999px;padding:.5em 1.15em;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:.4em;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:.25em .85em;font-size:.88rem}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:none;color:var(--primary);font:inherit;cursor:pointer;padding:.3em 0;text-decoration:underline}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-s);padding:.5em .7em;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input[type=radio],input[type=checkbox]{width:auto;min-height:auto;accent-color:var(--primary)}
input[type=file]{padding:.4em}
.field{display:grid;gap:.3rem;font-weight:700;font-size:.94rem}
.field small,.hint{font-weight:400;color:var(--muted);font-size:.86rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.9rem}
.stack{display:grid;gap:1rem}
.check{display:flex;gap:.5rem;align-items:flex-start;font-weight:400}

/* ===== Etiquetas de estado ===== */
.tag{display:inline-flex;align-items:center;gap:.35em;font-size:.8rem;font-weight:700;padding:.12em .65em;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.real{background:var(--real-bg);color:var(--real)}
.tag.sim{background:var(--sim-bg);color:var(--sim);outline:1.5px dashed var(--sim);outline-offset:-1.5px}
.tag.pend{background:var(--accent-soft);color:var(--accent-ink)}
.tag.ok{background:var(--real-bg);color:var(--real)}
.tag.bad{background:var(--danger-bg);color:var(--danger)}
.tag.plan{background:var(--primary-soft);color:var(--primary)}

/* Real vs simulado: la distinción visual central de la plataforma */
.rec{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--real);border-radius:var(--r-m);padding:.9rem 1rem}
.rec.sim{border-left:5px dashed var(--sim);background:repeating-linear-gradient(135deg,var(--sim-bg) 0 9px,var(--surface) 9px 18px)}
.rec.sim .rec-body{background:var(--surface);border-radius:var(--r-s);padding:.5rem .7rem;margin-top:.4rem}
.rec.neutral{border-left-color:var(--line)}
.rec-head{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:space-between}
.rec-head h4{margin:0}
.rec-list{display:grid;gap:.7rem}

/* ===== Barra superior ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.55rem;background:none;border:none;color:var(--ink);font:800 1.02rem var(--display);cursor:pointer;padding:.2rem}
.brand svg{width:34px;height:34px;flex:none}
.tb-mid{flex:1;display:flex;gap:.8rem;align-items:center;min-width:0}
.tb-project{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savestate{font-size:.85rem;color:var(--real);white-space:nowrap}
.savestate.err{color:var(--danger)}
.tb-user{display:flex;align-items:center;gap:.5rem}
.who{display:grid;text-align:right;line-height:1.2}
.who small{color:var(--muted)}
@media (max-width:720px){.brand span,.who,.tb-project{display:none}}

/* ===== Shell del proyecto ===== */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 60px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:1rem .7rem;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto}
.rail-back{display:block;margin:0 .4rem .8rem}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.stage{display:grid;grid-template-columns:30px 1fr;gap:.2rem .6rem;align-items:center;width:100%;text-align:left;background:none;border:none;border-radius:var(--r-m);padding:.55rem .6rem;color:var(--ink);font:inherit;cursor:pointer}
.stage:hover{background:var(--surface-2)}
.stage[aria-current="page"]{background:var(--primary-soft)}
.stage .num{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 .9rem var(--display);border:2px solid var(--line);color:var(--muted);background:var(--surface)}
.stage.done .num{background:var(--real);border-color:var(--real);color:var(--surface)}
.stage.practice .num{border-style:dashed;border-color:var(--sim);color:var(--sim)}
.stage .lbl{font-weight:700;font-size:.95rem}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.bar.full>i{background:var(--real)}
.rail-note{margin:1.2rem .4rem 0;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:.9rem}
.content{padding:2rem clamp(1rem,3vw,2.5rem) 4rem;max-width:1120px;width:100%}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:57px;z-index:15;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:.5rem;overflow-x:auto}
  .rail ol{display:flex;gap:4px}
  .stage{grid-template-columns:26px auto;white-space:nowrap;padding:.4rem .6rem}
  .stage .num{width:26px;height:26px;font-size:.8rem;grid-row:auto}
  .stage .bar{display:none}
  .rail-back,.rail-note{display:none}
}

/* ===== Páginas ===== */
.page{width:100%;max-width:1080px;margin:0 auto;padding:2rem clamp(1rem,3vw,2rem) 4rem}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
.sec-head{margin-bottom:1.4rem}
.sec-head .lead{margin-bottom:.4rem}
.block{margin-top:2rem}
.block>h3{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:1.2rem 1.3rem}
.panel.tinted{background:var(--surface-2);border-color:transparent}
.addform{background:var(--surface-2);border-radius:var(--r-l);padding:1.1rem 1.2rem;display:grid;gap:.8rem}
.addform h4{margin:0}
.empty{border:2px dashed var(--line);border-radius:var(--r-l);padding:1.5rem;text-align:center;color:var(--muted)}
.feedback{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:var(--r-m);padding:.8rem 1rem;margin-top:.8rem}
.feedback b{color:var(--ink)}
.feedback p{margin:.2rem 0 0}
.notice{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem 1rem;border-radius:var(--r-m);background:var(--primary-soft);font-size:.94rem}
.notice.sim{background:repeating-linear-gradient(135deg,var(--sim-bg) 0 9px,transparent 9px 18px);border:1.5px dashed var(--sim)}
.notice.warn{background:var(--danger-bg)}

/* Proyectos (inicio) */
.proj-list{display:grid;gap:1rem}
.proj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:1.2rem 1.3rem}
.proj h3{margin:0 0 .25rem}
.route-mini{display:flex;gap:4px;margin-top:.8rem;max-width:420px}
.route-mini span{flex:1;height:8px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.route-mini span i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.route-mini span.full i{background:var(--real)}
@media (max-width:600px){.proj{grid-template-columns:1fr}}

/* Resumen */
.stage-prog{display:grid;gap:.55rem}
.stage-prog button{display:grid;grid-template-columns:minmax(140px,220px) 1fr 3.5ch;gap:.8rem;align-items:center;background:none;border:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;padding:.25rem;border-radius:var(--r-s)}
.stage-prog button:hover{background:var(--surface-2)}
.stage-prog .pct{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.todo{list-style:none;padding:0;margin:0;display:grid;gap:.45rem}
.todo li button{display:flex;gap:.6rem;align-items:baseline;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:.6rem .8rem;font:inherit;color:var(--ink);cursor:pointer}
.todo li button:hover{border-color:var(--primary)}
.todo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-1px)}

/* Tabs de fases */
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1.4rem;padding:0;list-style:none}
.tabs button{display:flex;align-items:center;gap:.5rem;font:inherit;font-weight:700;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:.4em 1em .4em .45em;color:var(--ink);cursor:pointer}
.tabs button .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:800 .82rem var(--display)}
.tabs button.done .n{background:var(--real);color:var(--surface)}
.tabs button[aria-selected="true"]{border-color:var(--primary);background:var(--primary-soft)}

/* Mapa de empatía */
.empathy{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}
.empathy label{background:var(--surface);border:1.5px solid var(--line);padding:.8rem;display:grid;gap:.35rem;font-weight:700}
.empathy label:nth-child(1){border-radius:var(--r-l) var(--r-s) var(--r-s) var(--r-s)}
.empathy label:nth-child(2){border-radius:var(--r-s) var(--r-l) var(--r-s) var(--r-s)}
.empathy label:nth-child(3){border-radius:var(--r-s) var(--r-s) var(--r-s) var(--r-l)}
.empathy label:nth-child(4){border-radius:var(--r-s) var(--r-s) var(--r-l) var(--r-s)}
.empathy textarea{border:none;padding:0;min-height:80px;background:transparent;box-shadow:none!important}
@media (max-width:560px){.empathy{grid-template-columns:1fr}}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:.6rem .75rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:none}
td select,td input{min-height:36px;padding:.3em .5em}
td.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
tr.chosen td{background:var(--real-bg)}

/* Lean Canvas */
.canvas{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-areas:
  "pr pr so so pv pv ve ve sg sg"
  "pr pr me me pv pv ca ca sg sg"
  "co co co co co in in in in in";gap:6px}
.cb{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-s);padding:.65rem .7rem;display:flex;flex-direction:column;gap:.3rem;min-height:175px}
.cb.filled{border-color:color-mix(in srgb,var(--real) 45%,var(--line))}
.cb header{display:flex;gap:.45rem;align-items:baseline}
.cb .n{font:800 .8rem var(--display);color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:0 .45em}
.cb h4{margin:0;font-size:.92rem}
.cb small{color:var(--muted);font-size:.8rem;line-height:1.35}
.cb textarea{flex:1;border:none;background:transparent;padding:.2rem 0;min-height:90px;font-size:.92rem;box-shadow:none!important}
.a-pr{grid-area:pr}.a-so{grid-area:so}.a-me{grid-area:me}.a-pv{grid-area:pv}.a-ve{grid-area:ve}.a-ca{grid-area:ca}.a-sg{grid-area:sg}.a-co{grid-area:co;min-height:130px}.a-in{grid-area:in;min-height:130px}
@media (max-width:980px){.canvas{grid-template-areas:none;grid-template-columns:1fr 1fr}.cb{grid-area:auto!important}}
@media (max-width:560px){.canvas{grid-template-columns:1fr}}

/* Planificación */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}
.col{background:var(--surface-2);border-radius:var(--r-l);padding:.8rem;display:grid;gap:.6rem;align-content:start;min-height:140px}
.col h4{display:flex;justify-content:space-between;margin:0 0 .2rem}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:.7rem .8rem;display:grid;gap:.35rem}
.task b{line-height:1.3}
.task .meta{font-size:.84rem;color:var(--muted)}
.task.late{border-color:var(--danger)}
@media (max-width:800px){.board{grid-template-columns:1fr}}

/* Simulador */
.sim-frame{border:2px dashed var(--sim);border-radius:var(--r-l);padding:4px;background:repeating-linear-gradient(135deg,var(--sim-bg) 0 10px,transparent 10px 20px)}
.sim-inner{background:var(--surface);border-radius:calc(var(--r-l) - 4px);padding:1.3rem}
.sim-banner{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem}
.char{display:grid;gap:.15rem;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);padding:.8rem;font:inherit;color:var(--ink);cursor:pointer}
.char:hover{border-color:var(--sim)}
.char[aria-pressed="true"]{border-color:var(--sim);background:var(--sim-bg)}
.char .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 1rem var(--display);background:var(--sim-bg);color:var(--sim);margin-bottom:.3rem}
.char small{color:var(--muted)}
.chat{display:grid;gap:.6rem;margin:1rem 0;max-height:420px;overflow:auto;padding:.3rem}
.bubble{max-width:78%;padding:.6rem .85rem;border-radius:14px;line-height:1.45}
.bubble.q{justify-self:end;background:var(--primary-soft);border-bottom-right-radius:4px}
.bubble.a{justify-self:start;background:var(--sim-bg);border-bottom-left-radius:4px}
.bubble .who{display:block;font-size:.78rem;font-weight:700;color:var(--muted);text-align:left}
.qopts{display:grid;gap:.45rem}
.qopts button{text-align:left;font:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);padding:.55rem .8rem;color:var(--ink);cursor:pointer}
.qopts button:hover:not([disabled]){border-color:var(--primary)}
.qopts button[disabled]{opacity:.5;cursor:default}
.concl{display:grid;gap:.5rem}
.concl label{display:flex;gap:.6rem;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r-m);padding:.7rem .8rem;cursor:pointer;font-weight:400}
.concl label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.score{font:800 2.6rem var(--display);line-height:1}
.fb-list{display:grid;gap:.5rem;margin:.6rem 0 0;padding:0;list-style:none}
.fb-list li{padding:.55rem .75rem;border-radius:var(--r-m);background:var(--surface-2);font-size:.93rem}
.fb-list li.good{background:var(--real-bg)}
.fb-list li.weak{background:var(--accent-soft)}

/* Portafolio */
.pf-toolbar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.portfolio{background:#fff;color:#16224A;border:1px solid var(--line);border-radius:var(--r-s);padding:clamp(1.2rem,4vw,3rem);max-width:860px;font-size:.98rem}
.portfolio h1{font-size:2rem;color:#16224A}
.portfolio h2{font-size:1.35rem;margin-top:2rem;padding-bottom:.3rem;border-bottom:2px solid #16224A;color:#16224A}
.portfolio h3{font-size:1.05rem;margin-top:1.2rem;color:#16224A}
.portfolio .pf-cover{border-bottom:6px solid #F2A516;padding-bottom:1.2rem;margin-bottom:1rem}
.portfolio .pf-meta{color:#55618A}
.portfolio .pf-missing{border:1.5px dashed #B53925;color:#B53925;background:#FBE7E2;border-radius:6px;padding:.45rem .7rem;font-size:.9rem;margin:.4rem 0}
.portfolio .pf-sim{border:1.5px dashed #6A4BC4;background:#F5F1FE;border-radius:6px;padding:.5rem .7rem;font-size:.92rem;margin:.4rem 0}
.portfolio table{font-size:.88rem}
.portfolio th{background:#EEF2F9}
.portfolio th,.portfolio td{border-bottom:1px solid #D2DAEA}
.portfolio .pf-canvas{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.portfolio .pf-canvas div{border:1px solid #D2DAEA;border-radius:4px;padding:.45rem .55rem;font-size:.86rem;min-height:70px}
.portfolio .pf-canvas b{display:block;font-size:.8rem}
.portfolio .pf-disclaimer{margin-top:2rem;font-size:.85rem;color:#55618A;border-top:1px solid #D2DAEA;padding-top:.8rem}
.portfolio .tag{font-size:.75rem}
.portfolio .tag.real{background:#DFF3EC;color:#0E8468}
.portfolio .tag.sim{background:#ECE6FB;color:#6A4BC4;outline-color:#6A4BC4}
.portfolio .tag.ok{background:#DFF3EC;color:#0E8468}
.portfolio .tag.bad{background:#FBE7E2;color:#B53925}
.portfolio .tag.pend{background:#FFF2D3;color:#7A4E00}

/* Docente */

.rubric{display:grid;gap:.6rem}

.chips{display:flex;gap:.45rem;flex-wrap:wrap}

.chip.off{opacity:.55;text-decoration:line-through}

/* Login */
.login{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);flex:1;gap:0}
.login-hero{padding:clamp(2rem,6vw,5rem);background:var(--primary);color:var(--on-primary);position:relative;overflow:hidden}
.login-hero h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.02;max-width:12ch;color:var(--on-primary)}
.login-hero .lead{color:var(--on-primary);opacity:.85}
.brandline{display:flex;gap:.6rem;align-items:center;font:700 1rem var(--display);margin-bottom:2.5rem}
.brandline svg{width:40px;height:40px}
.route{list-style:none;padding:0;margin:2.5rem 0 0;display:grid;gap:0;max-width:440px}
.route li{display:grid;grid-template-columns:34px 1fr;gap:.9rem;align-items:center;position:relative;padding:.42rem 0}

.route li:last-child::before{display:none}
.route .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 .9rem var(--display);background:var(--primary);border:2px solid color-mix(in srgb,var(--on-primary) 55%,transparent);position:relative;z-index:1}

/* Diálogo y toast */
dialog{border:none;border-radius:var(--r-l);padding:0;max-width:560px;width:calc(100% - 2rem);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,60,.35)}
dialog::backdrop{background:rgba(14,20,48,.55)}
dialog form{padding:1.5rem;display:grid;gap:.9rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:var(--r-m);font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:min(92vw,520px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger);color:#fff}
details summary{cursor:pointer;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Impresión del portafolio */
@media print{

  .portfolio h2{break-after:avoid}
  .portfolio table,.portfolio .pf-canvas{break-inside:avoid}
  :root{padding:0}
}

/* ---------- Progreso calculado a partir de datos (RN-006) ---------- */
function dtProgress(p){
  const e = p.dt.empatizar, df = p.dt.definir, i = p.dt.idear, pr = p.dt.prototipar, ev = p.dt.evaluar;
  const phases = {
    empatizar: avg([e.records.some(r => r.origin === 'real'), Object.values(e.map).filter(filled).length >= 3, filled(e.profile)]),
    definir: avg([filled(df.problem), filled(df.pov), filled(df.hmw)]),
    idear: avg([Math.min(i.ideas.length / 4, 1), !!i.chosen, filled(i.justification)]),
    prototipar: avg([pr.versions.length > 0, pr.versions.some(v => v.status === 'construido')]),
    evaluar: avg([ev.tests.length > 0, ev.tests.some(x => filled(x.improvements))])
  };
  return {phases, total:avg(Object.values(phases))};
}
function progress(p){
  const blocks = CANVAS.filter(b => filled(p.canvas[b.key])).length / CANVAS.length;
  const cl = Store.data.checklist;
  const covered = cl.filter(c => p.evidences.some(e => e.req === c.id && e.kind === 'real')).length;
  const r = {
    preparacion: avg([p.team.length > 0, p.team.some(m => filled(m.resp)), p.objectives.length > 0, filled(p.prep.start)]),
    dt: dtProgress(p).total,
    simulador: p.simulations.length ? 1 : 0,
    canvas: blocks * .8 + (p.hypotheses.length ? .2 : 0),
    plan: avg([p.activities.length > 0, p.activities.length >= 3, p.activities.some(a => a.status === 'completada')]),
    validacion: avg([p.validations.length > 0, p.validations.some(v => v.hypothesisId), p.validations.some(v => filled(v.learnings))]),
    evidencias: cl.length ? covered / cl.length : 1
  };
  r.portafolio = avg([r.preparacion, r.dt, r.canvas, r.plan, r.validacion, r.evidencias]);
  r.resumen = r.portafolio;
  return r;
}
function pending(p){
  const t = [], dt = p.dt;
  if (!p.objectives.length) t.push(['preparacion', 'Define al menos un objetivo del proyecto.']);
  if (!p.team.some(m => filled(m.resp))) t.push(['preparacion', 'Asigna responsabilidades al equipo.']);
  if (!dt.empatizar.records.some(r => r.origin === 'real')) t.push(['dt', 'Registra una entrevista u observación real. Las simuladas no cuentan como evidencia.']);
  if (!filled(dt.definir.pov)) t.push(['dt', 'Escribe el punto de vista del usuario (POV).']);
  if (dt.idear.ideas.length < 4) t.push(['dt', `Propón ${4 - dt.idear.ideas.length} alternativa(s) más de solución.`]);
  if (!dt.idear.chosen) t.push(['dt', 'Elige una alternativa y justifica tu elección.']);
  if (!dt.prototipar.versions.some(v => v.status === 'construido')) t.push(['dt', 'Construye tu prototipo y regístralo como construido.']);
  if (!dt.evaluar.tests.length) t.push(['dt', 'Registra una prueba de tu prototipo.']);
  const empty = CANVAS.filter(b => !filled(p.canvas[b.key])).length;
  if (empty) t.push(['canvas', `Completa ${empty} bloque(s) del Lean Canvas.`]);
  if (!p.hypotheses.length) t.push(['canvas', 'Formula una hipótesis para validar.']);
  if (!p.activities.length) t.push(['plan', 'Planifica las actividades del proyecto.']);
  if (!p.validations.length) t.push(['validacion', 'Registra una prueba con usuarios reales.']);
  const miss = Store.data.checklist.filter(c => !p.evidences.some(e => e.req === c.id && e.kind === 'real')).length;
  if (miss) t.push(['evidencias', `Faltan ${miss} evidencia(s) de la lista de comprobación.`]);
  return t;
}

/* --- Simulador (HU-006) --- */
function secSim(p){
  const active = SCENARIOS.filter(s => (Store.data.scenarios.find(x => x.id === s.id) || {}).active);
  const st = S.sim;
  let inner;
  if (!st) {
    inner = `<h3>Elige un escenario</h3>
      <div class="rec-list">${active.map(s => `<div class="rec sim"><div class="rec-head"><h4>${esc(s.title)}</h4><span class="tag sim">${esc(s.category)}</span></div><div class="rec-body"><p>${esc(s.context)}</p><button class="btn primary sm" data-action="simStart" data-id="${s.id}">Iniciar simulación</button></div></div>`).join('') || '<p class="muted">No hay escenarios activos. Consulta con la administración.</p>'}</div>
      ${p.simulations.length ? `<section class="block"><h3>Tus prácticas anteriores</h3><div class="rec-list">${p.simulations.slice().reverse().map(r => `<div class="rec sim"><div class="rec-head"><b>${esc(r.title)}</b><span class="tag sim">${r.score} de ${r.max} puntos</span></div><div class="rec-body small"><p style="margin:0">${fmtDate(r.date)}. Conclusión: ${esc(r.conclusion)} ${r.correct ? '<span class="tag ok">Acertada</span>' : '<span class="tag pend">Por mejorar</span>'}</p>${r.reflection ? `<p style="margin:.3rem 0 0"><i>${esc(r.reflection)}</i></p>` : ''}</div></div>`).join('')}</div></section>` : ''}`;
  } else {
    const sc = SCENARIOS.find(s => s.id === st.scenarioId);
    const left = sc.maxQ - st.asked.length;
    if (st.phase === 'interview') {
      const ch = sc.chars.find(c => c.id === st.char);
      inner = `<div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(sc.title)}</h3><span class="tag sim">${left} pregunta(s) disponible(s)</span></div>
        <p class="muted" style="margin-top:.5rem">${esc(sc.context)}</p>
        <h4>¿A quién quieres entrevistar?</h4>
        <div class="chars">${sc.chars.map(c => `<button class="char" aria-pressed="${st.char === c.id}" data-action="simChar" data-id="${c.id}"><span class="avatar" aria-hidden="true">${initials(c.name)}</span><b>${esc(c.name)}</b><small>${esc(c.role)}</small></button>`).join('')}</div>
        <div class="chat" aria-live="polite">${st.asked.map(a => { const c = sc.chars.find(x => x.id === a.c), q = c.qs[a.q]; return `<div class="bubble q"><span class="who">Tú a ${esc(c.name)}</span>${esc(q.q)}</div><div class="bubble a"><span class="who">${esc(c.name)} (simulado)</span>${esc(q.a)}</div>`; }).join('') || '<p class="muted">Elige a una persona y hazle una pregunta.</p>'}</div>
        ${ch && left > 0 ? `<h4>Preguntas para ${esc(ch.name)}</h4><div class="qopts">${ch.qs.map((q, i) => { const used = st.asked.some(a => a.c === ch.id && a.q === i); return `<button data-action="simAsk" data-q="${i}"${used ? ' disabled' : ''}>${esc(q.q)}${used ? ' <span class="muted small">(ya preguntada)</span>' : ''}</button>`; }).join('')}</div>` : ''}
        <div class="row" style="margin-top:1.2rem;justify-content:space-between"><button class="btn ghost sm" data-action="simCancel">Salir sin guardar</button><button class="btn primary" data-action="simToConclude"${st.asked.length ? '' : ' disabled'}>Pasar a la conclusión</button></div>`;
    } else if (st.phase === 'conclude') {
      inner = `<h3>¿Qué problema necesitas investigar?</h3><p class="muted">Elige la conclusión que mejor se apoya en lo que escuchaste.</p>
        <form data-form="simConclude" class="concl">${sc.conclusions.map((c, i) => `<label><input type="radio" name="c" value="${i}" required><span>${esc(c.text)}</span></label>`).join('')}
        <div class="row" style="justify-content:space-between;margin-top:.6rem"><button type="button" class="btn ghost sm" data-action="simBack">Volver a las entrevistas</button><button class="btn primary" type="submit">Ver retroalimentación</button></div></form>`;
    } else {
      const r = st.result;
      inner = `<div class="row" style="align-items:flex-end;gap:1.2rem"><div><span class="score">${r.score}</span><span class="muted"> de ${r.max} puntos</span></div><p style="margin:0;max-width:52ch">${r.score >= 15 ? 'Investigaste bien: escuchaste a varias fuentes y llegaste a una conclusión con fundamento.' : r.score >= 9 ? 'Vas por buen camino. Revisa qué preguntas te dieron más información.' : 'Practica de nuevo con preguntas abiertas sobre la experiencia de las personas.'}</p></div>
        <h4 style="margin-top:1.3rem">Sobre tus preguntas</h4>
        <ul class="fb-list">${r.items.map(it => `<li class="${it.pts >= 2 ? 'good' : 'weak'}"><b>${esc(it.q)}</b> <span class="tag">${esc(it.kind)}</span><br>${esc(it.fb)}</li>`).join('')}
        ${r.diversity ? '<li class="good"><b>Entrevistaste a los tres perfiles.</b> Contrastar fuentes te da una visión más completa (+2).</li>' : '<li class="weak"><b>No entrevistaste a todos los perfiles.</b> Escuchar a cada actor ayuda a no sacar conclusiones apresuradas.</li>'}</ul>
        <h4 style="margin-top:1.3rem">Sobre tu conclusión</h4><div class="feedback"><b>${esc(r.conclusion)}</b><p>${esc(r.cfb)}</p></div>
        <form data-form="simSave" class="stack" style="margin-top:1.3rem">
          <label class="field">¿Qué aprendiste en esta práctica?<textarea name="reflection" placeholder="Por ejemplo: qué preguntas harías distinto con usuarios reales."></textarea></label>
          <label class="check"><input type="checkbox" name="copy"> Copiar los hallazgos a Empatizar como registro simulado (no contará como evidencia real)</label>
          <div class="row" style="justify-content:space-between"><button type="button" class="btn ghost sm" data-action="simCancel">Descartar resultado</button><button class="btn primary" type="submit">Guardar resultado</button></div>
        </form>`;
    }
  }
  return `${head('Simulador', 'Practica entrevistas y decisiones antes de trabajar con usuarios reales. Aquí puedes equivocarte sin consecuencias.', 'simulador', p)}
  <div class="sim-frame"><div class="sim-inner">
    <div class="sim-banner"><span class="tag sim">Escenario simulado</span><span class="muted small">Las respuestas son de personajes ficticios. No se registran como entrevistas ni evidencias reales.</span></div>
    ${inner}
  </div></div>`;
}

/* --- Lean Canvas (HU-007) --- */

  ${p.canvasVersions.length ? `<div style="margin-top:.8rem">${versionsList(p.canvasVersions, v => `<div class="grid3 small">${CANVAS.map(b => `<div><b>${b.label}</b><br>${esc(v.data[b.key]) || '<span class="muted">—</span>'}</div>`).join('')}</div>`)}</div>` : ''}
  <section class="block"><h3>Hipótesis por validar</h3>

    <div class="rec-list">${p.hypotheses.map(h => hypCard(p, h)).join('') || '<div class="empty">Formula tu primera hipótesis.</div>'}</div>
    <form class="addform" data-add="hypotheses" data-msg="Hipótesis agregada" style="margin-top:1rem">
      <h4>Nueva hipótesis</h4>
      <div class="grid2"><label class="field">Bloque relacionado<select name="block">${opts(CANVAS.map(b => [b.key, b.label]))}</select></label><label class="field">Método de validación<input name="method" placeholder="Ej.: entrevistas, preventa, piloto"></label></div>
      <label class="field">Hipótesis<input name="text" required placeholder="Creemos que… Lo sabremos si…"></label>
      <div><button class="btn primary sm" type="submit">Agregar hipótesis</button></div>
    </form>
  </section>`;
}
function hypCard(p, h){
  const linked = p.validations.filter(v => v.hypothesisId === h.id).length;
  const cls = {pendiente:'pend', validada:'ok', refutada:'bad'}[h.status];
  return `<article class="rec neutral"><div class="rec-head"><h4>${esc(h.text)}</h4><div class="row" style="gap:.4rem"><span class="tag ${cls}">${HYP[h.status]}</span>${del('hypotheses', h.id)}</div></div>
    <p class="muted small" style="margin:.3rem 0 .6rem">Bloque: ${esc((CANVAS.find(b => b.key === h.block) || {}).label)}. ${linked} prueba(s) asociada(s) en Ejecución y validación.</p>
    <div class="grid2">${fld('hypotheses', h, 'method', 'Método de validación')}

}

/* --- Planificación (HU-008) --- */
function secPlan(p){
  const acts = p.activities.slice().sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  const names = p.team.map(m => m.name);
  const late = a => a.status !== 'completada' && a.end && a.end < today();
  return `${head('4. Planificación', 'Organiza las actividades, asigna responsables y sigue el avance.', 'plan', p)}
  <div class="board">${Object.entries(STATUS).map(([k, l]) => { const list = acts.filter(a => a.status === k); return `<section class="col" aria-label="${l}"><h4>${l} <span class="muted">${list.length}</span></h4>
    ${list.map(a => `<div class="task${late(a) ? ' late' : ''}"><b>${esc(a.title)}</b><span class="meta">${esc(a.resp) || 'Sin responsable'}. ${fmtDate(a.start)} al ${fmtDate(a.end)}</span>${late(a) ? '<span class="tag bad">Atrasada</span>' : ''}
      <select aria-label="Estado de ${esc(a.title)}" data-coll="activities" data-id="${a.id}" data-field="status" data-rerender="1">${opts(Object.entries(STATUS), a.status)}</select></div>`).join('') || '<p class="muted small" style="margin:0">Sin actividades.</p>'}</section>`; }).join('')}</div>
  <section class="block"><h3>Cronograma</h3>
    ${acts.length ? `<div class="tbl-wrap"><table><thead><tr><th>Actividad</th><th>Responsable</th><th>Inicio</th><th>Fin</th><th>Estado</th><th><span class="sr-only">Acciones</span></th></tr></thead><tbody>
    ${acts.map(a => `<tr><td>${esc(a.title)}</td><td>${esc(a.resp)}</td><td>${fmtDate(a.start)}</td><td>${fmtDate(a.end)}</td><td><span class="tag ${a.status === 'completada' ? 'ok' : a.status === 'progreso' ? 'plan' : 'pend'}">${STATUS[a.status]}</span></td><td>${del('activities', a.id)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Agrega tu primera actividad.</div>'}
    <form class="addform" data-add="activities" data-msg="Actividad agregada" style="margin-top:1rem">
      <h4>Nueva actividad</h4>
      <label class="field">Actividad<input name="title" required></label>
      <div class="grid3"><label class="field">Responsable<select name="resp">${opts(names)}</select></label><label class="field">Inicio<input type="date" name="start" required value="${today()}"></label><label class="field">Fin<input type="date" name="end" required></label></div>
      <div><button class="btn primary sm" type="submit">Agregar actividad</button></div>
    </form>
  </section>
  <section class="block"><h3>Riesgos y dificultades</h3>
    <div class="rec-list">${p.risks.map(r => `<div class="rec neutral"><div class="rec-head"><b>${esc(r.text)}</b>${del('risks', r.id)}</div>${r.plan ? `<p class="small" style="margin:.3rem 0 0">Qué haremos: ${esc(r.plan)}</p>` : ''}</div>`).join('') || '<p class="muted">Sin riesgos registrados.</p>'}</div>
    <form class="addform" data-add="risks" data-msg="Riesgo registrado" style="margin-top:.8rem"><div class="grid2"><label class="field">Riesgo o dificultad<input name="text" required></label><label class="field">¿Qué harán si ocurre?<input name="plan"></label></div><div><button class="btn primary sm" type="submit">Registrar riesgo</button></div></form>
  </section>`;
}

    <div class="rec-head"><h4>${esc(v.action)}</h4><div class="row" style="gap:.4rem"><span class="tag ${v.origin === 'hipotetico' ? 'sim' : 'real'}">${v.origin === 'hipotetico' ? 'Valor estimado' : 'Dato real'}</span>${del('validations', v.id)}</div></div>
    <div class="rec-body small"><p class="muted" style="margin:0 0 .3rem">${fmtDate(v.date)}. Método: ${esc(v.method)}${h ? `. Hipótesis: «${esc(h.text)}»` : ''}</p>

  <form class="addform" data-add="validations" data-msg="Prueba registrada" style="margin-top:1rem">

    <div class="grid3"><label class="field">Fecha<input type="date" name="date" value="${today()}" required></label>

      <label class="field">Tipo de dato<select name="origin">${opts([['real', 'Dato real'], ['hipotetico', 'Valor estimado o hipotético']])}</select></label></div>

    <label class="check"><input type="checkbox" name="copyResult"> Usar estos resultados como resultado de la hipótesis seleccionada</label>
    <div><button class="btn primary sm" type="submit">Guardar registro</button></div>

/* --- Evidencias (HU-010) --- */
function secEv(p){
  const cfg = Store.data.config, cl = Store.data.checklist, pf = S.prefill || {};
  const groups = STAGES.filter(s => s.n && s.id !== 'portafolio' && s.id !== 'evidencias');
  const accept = cfg.types.split(',').map(x => '.' + x.trim()).join(',');
  const evRow = e => `<article class="rec ${e.kind === 'practica' ? 'sim' : ''}"><div class="rec-head"><h4>${esc(e.title)}</h4><div class="row" style="gap:.4rem"><span class="tag ${e.kind === 'practica' ? 'sim' : 'real'}">${e.kind === 'practica' ? 'Material de práctica' : 'Evidencia real'}</span><button class="btn sm ghost" data-action="download" data-id="${e.id}">Descargar</button>${del('evidences', e.id)}</div></div>
    <div class="rec-body small"><p style="margin:0">${esc(e.fileName)} (${(e.size / 1048576).toFixed(1)} MB). Subido por ${esc(e.author)} el ${fmtDate(e.date)}.</p>${e.desc ? `<p style="margin:.3rem 0 0">${esc(e.desc)}</p>` : ''}${e.req ? `<p style="margin:.3rem 0 0" class="muted">Cumple: ${esc((cl.find(c => c.id === e.req) || {}).name)}</p>` : ''}</div></article>`;
  return `${head('6. Evidencias', 'Adjunta fotos, documentos y archivos que muestran el trabajo realizado en cada etapa.', 'evidencias', p)}
  <section class="panel"><h3>Lista de comprobación</h3>
    <ul class="todo">${cl.map(c => { const ok = p.evidences.some(e => e.req === c.id && e.kind === 'real'); return `<li><span class="row" style="gap:.6rem;padding:.35rem 0"><span class="tag ${ok ? 'ok' : 'pend'}">${ok ? '✓ Entregada' : 'Falta'}</span>${esc(c.name)}</span></li>`; }).join('')}</ul>
  </section>
  <form class="addform block" data-add="evidences" data-msg="Evidencia subida">
    <h4>Subir evidencia</h4>
    <label class="field">Archivo<input type="file" name="file" required accept="${esc(accept)}"><small>Formatos: ${esc(cfg.types)}. Tamaño máximo: ${cfg.maxMB} MB.</small></label>
    <div class="grid2"><label class="field">Título<input name="title" required value="${esc(pf.title || '')}"></label>
      <label class="field">Tipo<select name="kind">${opts([['real', 'Evidencia real'], ['practica', 'Material de práctica']])}</select></label></div>
    <div class="grid2"><label class="field">Etapa<select name="stage">${opts(groups.map(s => [s.id, s.label]), pf.stage || 'dt')}</select></label>
      <label class="field">Requisito que cumple<select name="req">${opts([['', 'Ninguno en particular'], ...cl.map(c => [c.id, c.name])], pf.req || '')}</select></label></div>
    <label class="field">Descripción<input name="desc"></label>
    <div><button class="btn primary sm" type="submit">Subir evidencia</button></div>
  </form>
  ${groups.map(g => { const list = p.evidences.filter(e => e.stage === g.id); return list.length ? `<section class="block"><h3>${g.label}</h3><div class="rec-list">${list.map(evRow).join('')}</div></section>` : ''; }).join('')}
  ${!p.evidences.length ? '<div class="empty block">Aún no hay evidencias.</div>' : ''}`;
}

/* --- Portafolio (HU-011) --- */
function secPortfolio(p){
  return `${head('7. Portafolio', 'Revisa el documento que se genera con lo que registraste. Las secciones incompletas aparecen marcadas.', 'portafolio', p)}
  <div class="pf-toolbar"><button class="btn primary" data-action="print">Exportar a PDF</button><span class="muted small">En la ventana de impresión, elige «Guardar como PDF».</span></div>
  ${portfolioHTML(p)}`;
}
function portfolioHTML(p){
  const dt = p.dt, miss = (ok, msg) => ok ? '' : `<div class="pf-missing">Sección incompleta: ${msg}</div>`;
  const real = dt.empatizar.records.filter(r => r.origin === 'real'), sim = dt.empatizar.records.filter(r => r.origin === 'simulada');
  const chosen = dt.idear.ideas.find(i => i.id === dt.idear.chosen);
  const evReal = p.evidences.filter(e => e.kind === 'real'), evPr = p.evidences.filter(e => e.kind === 'practica');
  return `<article class="portfolio" id="portfolio">
  <div class="pf-cover"><p class="pf-meta">Portafolio de proyecto. Crea y Emprende</p><h1>${esc(p.name)}</h1><p>${esc(p.description)}</p>
    <p class="pf-meta">Categoría: ${esc(p.category)}. Docente asesor: ${esc(userName(p.teacherId))}. Generado el ${fmtDate(nowISO())}.</p></div>
  <h2>1. Equipo y objetivos</h2>
  <table><thead><tr><th>Integrante</th><th>Rol</th><th>Responsabilidad</th></tr></thead><tbody>${p.team.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.role)}</td><td>${esc(m.resp)}</td></tr>`).join('')}</tbody></table>
  ${p.objectives.length ? `<ol>${p.objectives.map(o => `<li>${esc(o.text)}</li>`).join('')}</ol>` : miss(false, 'no hay objetivos registrados.')}
  ${p.prep.start ? `<p><b>Punto de partida:</b> ${esc(p.prep.start)}</p>` : ''}
  <h2>2. Design Thinking</h2>
  <h3>Empatizar</h3>
  ${real.length ? real.map(r => `<p><span class="tag real">Real</span> <b>${esc(r.type)}, ${fmtDate(r.date)}:</b> ${esc(r.person)}. ${esc(r.findings)}</p>`).join('') : miss(false, 'no hay entrevistas u observaciones reales.')}
  ${sim.length ? `<div class="pf-sim"><b>Práctica simulada.</b> Estos registros provienen de simulaciones y no constituyen evidencia de trabajo de campo.<br>${sim.map(r => esc(r.findings)).join('<br>')}</div>` : ''}
  ${dt.empatizar.profile ? `<p><b>Perfil de usuario:</b> ${esc(dt.empatizar.profile)}</p>` : ''}
  <h3>Definir</h3>
  ${dt.definir.pov ? `<p><b>Problema:</b> ${esc(dt.definir.problem)}</p><p><b>Punto de vista:</b> ${esc(dt.definir.pov)}</p><p><b>Pregunta de diseño:</b> ${esc(dt.definir.hmw)}</p>` : miss(false, 'falta el punto de vista del usuario.')}
  <h3>Idear</h3>
  ${chosen ? `<p>Se evaluaron ${dt.idear.ideas.length} alternativas con los criterios: ${dt.idear.criteria.map(c => esc(c.name)).join(', ')}.</p><p><b>Alternativa elegida:</b> ${esc(chosen.title)}. ${esc(dt.idear.justification)}</p>` : miss(false, 'no se ha elegido una alternativa.')}
  <h3>Prototipar</h3>
  ${dt.prototipar.versions.length ? dt.prototipar.versions.map(v => `<p><b>Versión ${v.v}</b> <span class="tag ${v.status === 'construido' ? 'ok' : 'pend'}">${v.status === 'construido' ? 'Construido' : 'Planificado'}</span> ${esc(v.desc)}${v.materials ? ` Materiales: ${esc(v.materials)}.` : ''}</p>`).join('') : miss(false, 'no hay prototipo documentado.')}
  <h3>Evaluar</h3>
  ${dt.evaluar.tests.length ? dt.evaluar.tests.map(t => `<p><b>${esc(t.objective)}</b> (versión ${esc(t.version)}): ${esc(t.results)} ${t.improvements ? 'Mejoras: ' + esc(t.improvements) : ''}</p>`).join('') : miss(false, 'no hay pruebas del prototipo.')}
  <h2>3. Lean Canvas</h2>
  <div class="pf-canvas">${CANVAS.map(b => `<div><b>${b.n}. ${b.label}</b>${esc(p.canvas[b.key]).replace(/\n/g, '<br>') || '<span style="color:#B53925">Sin completar</span>'}</div>`).join('')}</div>
  ${p.hypotheses.length ? `<h3>Hipótesis</h3><table><thead><tr><th>Hipótesis</th><th>Método</th><th>Estado</th><th>Resultado</th></tr></thead><tbody>${p.hypotheses.map(h => `<tr><td>${esc(h.text)}</td><td>${esc(h.method)}</td><td><span class="tag ${{pendiente:'pend', validada:'ok', refutada:'bad'}[h.status]}">${HYP[h.status]}</span></td><td>${esc(h.result) || '—'}</td></tr>`).join('')}</tbody></table>` : ''}
  <h2>4. Planificación</h2>
  ${p.activities.length ? `<table><thead><tr><th>Actividad</th><th>Responsable</th><th>Fechas</th><th>Estado</th></tr></thead><tbody>${p.activities.slice().sort((a, b) => (a.start || '').localeCompare(b.start || '')).map(a => `<tr><td>${esc(a.title)}</td><td>${esc(a.resp)}</td><td>${fmtDate(a.start)} al ${fmtDate(a.end)}</td><td>${STATUS[a.status]}</td></tr>`).join('')}</tbody></table>` : miss(false, 'no hay actividades planificadas.')}
  <h2>5. Ejecución y validación</h2>
  ${p.validations.length ? p.validations.map(v => `<p><span class="tag ${v.origin === 'hipotetico' ? 'sim' : 'real'}">${v.origin === 'hipotetico' ? 'Valor estimado' : 'Dato real'}</span> <b>${esc(v.action)}</b> (${fmtDate(v.date)}): ${esc(v.results)}${v.learnings ? ' Aprendizaje: ' + esc(v.learnings) : ''}</p>`).join('') : miss(false, 'no hay pruebas con usuarios registradas.')}
  <h2>6. Evidencias</h2>
  ${evReal.length ? `<ul>${evReal.map(e => `<li><b>${esc(e.title)}</b> (${esc(stageLabel(e.stage))}, ${fmtDate(e.date)}): ${esc(e.fileName)}</li>`).join('')}</ul>` : miss(false, 'no hay evidencias reales.')}
  ${evPr.length ? `<div class="pf-sim"><b>Material de práctica:</b> ${evPr.map(e => esc(e.title)).join(', ')}.</div>` : ''}
  <p class="pf-disclaimer">Este portafolio se generó con la información registrada por el equipo en el Laboratorio Virtual de Emprendimiento. Es un documento de apoyo para preparar el proyecto y no garantiza el cumplimiento de los requisitos oficiales del concurso Crea y Emprende.</p>
  </article>`;
}

/* ---------- Docente (HU-012) ---------- */
function teacherView(){

    const cols = ['preparacion', 'dt', 'canvas', 'plan', 'validacion', 'evidencias'];
    return `<main class="page"><div class="page-head"><div><h1>Proyectos asignados</h1><p class="lead">Revisa el avance de cada equipo y deja retroalimentación por etapa.</p></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Proyecto</th><th>Equipo</th>${cols.map(c => `<th>${STAGES.find(s => s.id === c).label}</th>`).join('')}<th>Actualizado</th><th><span class="sr-only">Acciones</span></th></tr></thead><tbody>

    <div class="review">
      <div class="stack">
        <section class="panel no-print"><h3>Avance por etapa</h3><div class="stage-prog">${STAGES.filter(s => s.n).map(s => `<button tabindex="-1" style="cursor:default"><span>${s.n}. ${s.label}</span>${bar(pr[s.id])}<span class="pct">${pct(pr[s.id])}%</span></button>`).join('')}</div>
          ${todo.length ? `<details style="margin-top:.8rem"><summary>${todo.length} actividades pendientes</summary><ul>${todo.map(([s, t]) => `<li class="small">${esc(stageLabel(s))}: ${esc(t)}</li>`).join('')}</ul></details>` : ''}</section>
        <p class="notice no-print">Vista de solo lectura. El docente no puede modificar las respuestas del estudiante; sus comentarios y evaluaciones quedan registrados con nombre y fecha.</p>
        ${portfolioHTML(p)}

      <aside class="no-print">
        <form class="panel stack" data-form="comment"><h3>Retroalimentación</h3>
          <label class="field">Etapa<select name="stage">${opts([...STAGES.filter(s => s.n || s.practice).map(s => [s.id, s.label]), ['general', 'Proyecto en general']])}</select></label>
          <label class="field">Comentario<textarea name="text" required></textarea></label>
          <button class="btn primary sm" type="submit">Enviar comentario</button>
          ${p.comments.length ? `<details><summary>${p.comments.length} comentario(s) enviados</summary>${p.comments.slice().reverse().map(c => `<div class="feedback small"><b>${esc(stageLabel(c.stage))}</b>, ${fmtDate(c.date)}<p>${esc(c.text)}</p></div>`).join('')}</details>` : ''}
        </form>
        <form class="panel stack" data-form="evaluate"><h3>Evaluación con rúbrica</h3>
          <div class="rubric">${Store.data.rubric.map(r => `<label>${esc(r.name)}<select name="${r.id}" required>${opts([['', 'Elegir'], [1, '1 En inicio'], [2, '2 En proceso'], [3, '3 Logrado'], [4, '4 Destacado']])}</select></label>`).join('')}</div>
          <label class="field">Observaciones<textarea name="notes"></textarea></label>
          <button class="btn primary sm" type="submit">Guardar evaluación</button>
          ${p.evaluations.length ? `<details><summary>${p.evaluations.length} evaluación(es) anteriores</summary>${p.evaluations.slice().reverse().map(e => `<div style="margin-top:.6rem"><p class="small muted">${esc(e.teacherName)}, ${fmtDate(e.date)}</p>${rubricTable(e)}</div>`).join('')}</details>` : ''}

function rubricTable(e){

}

    ${D.users.map(u => `<tr><td><b>${esc(u.name)}</b></td><td class="small">${esc(u.email)}</td><td><select aria-label="Rol de ${esc(u.name)}" data-admin="role" data-id="${u.id}"${u.id === S.userId ? ' disabled' : ''}>${opts(Object.entries(ROLE_LABEL), u.role)}</select></td><td><span class="tag ${u.active ? 'ok' : 'bad'}">${u.active ? 'Activa' : 'Desactivada'}</span></td><td>${u.id === S.userId ? '' : `<button class="btn sm" data-action="toggleUser" data-id="${u.id}">${u.active ? 'Desactivar' : 'Activar'}</button>`}</td></tr>`).join('')}
    </tbody></table></div>
    <form class="addform block" data-form="addUser"><h4>Crear cuenta</h4><div class="grid3"><label class="field">Nombre<input name="name" required></label><label class="field">Correo<input type="email" name="email" required></label><label class="field">Rol<select name="role">${opts(Object.entries(ROLE_LABEL))}</select></label></div><div><button class="btn primary sm" type="submit">Crear cuenta</button></div><p class="hint" style="margin:0">La persona recibirá un enlace para crear su contraseña.</p></form>`;
  if (tab === 'categorias') body = `<p class="muted">Las categorías desactivadas dejan de aparecer para proyectos nuevos, pero los proyectos existentes las conservan.</p>
    <div class="chips">${D.categories.map(c => `<span class="chip${c.active ? '' : ' off'}">${esc(c.name)}<button data-action="toggleCat" data-id="${c.id}" aria-label="${c.active ? 'Desactivar' : 'Activar'} ${esc(c.name)}" title="${c.active ? 'Desactivar' : 'Activar'}">${c.active ? '×' : '+'}</button></span>`).join('')}</div>
    <form class="row block" data-form="addCat" style="max-width:460px"><input name="name" required placeholder="Nueva categoría" aria-label="Nueva categoría" style="flex:1"><button class="btn primary sm" type="submit">Agregar categoría</button></form>`;
  if (tab === 'escenarios') body = `<div class="rec-list">${SCENARIOS.map(s => { const st = D.scenarios.find(x => x.id === s.id) || {active:false}; return `<div class="rec sim"><div class="rec-head"><h4>${esc(s.title)}</h4><div class="row" style="gap:.4rem"><span class="tag ${st.active ? 'ok' : 'pend'}">${st.active ? 'Activo' : 'Inactivo'}</span><button class="btn sm" data-action="toggleScen" data-id="${s.id}">${st.active ? 'Desactivar' : 'Activar'}</button></div></div><div class="rec-body small"><p style="margin:0">${esc(s.category)}. ${s.chars.length} personajes, ${s.chars.reduce((n, c) => n + c.qs.length, 0)} preguntas, ${s.conclusions.length} conclusiones posibles.</p></div></div>`; }).join('')}</div>
    <p class="notice block">El editor de escenarios (personajes, preguntas, puntajes y retroalimentación) se construye en la siguiente iteración. Desactivar un escenario no borra los resultados ya guardados por los estudiantes.</p>`;
  if (tab === 'contenidos') body = `<h3>Lista de comprobación de evidencias</h3>
    <div class="rec-list">${D.checklist.map(c => `<div class="rec neutral"><div class="rec-head"><span>${esc(c.name)} <span class="muted small">(${esc(stageLabel(c.stage))})</span></span><button class="btn sm ghost danger" data-action="delCheck" data-id="${c.id}">Quitar</button></div></div>`).join('')}</div>
    <form class="addform block" data-form="addCheck"><div class="grid2"><label class="field">Evidencia requerida<input name="name" required></label><label class="field">Etapa<select name="stage">${opts(STAGES.filter(s => s.n && s.n < 6).map(s => [s.id, s.label]))}</select></label></div><div><button class="btn primary sm" type="submit">Agregar requisito</button></div></form>
    <h3 class="block">Rúbrica docente</h3>
    <div class="rec-list">${D.rubric.map(r => `<div class="rec neutral"><div class="rec-head"><span>${esc(r.name)}</span><button class="btn sm ghost danger" data-action="delRub" data-id="${r.id}">Quitar</button></div></div>`).join('')}</div>
    <form class="row block" data-form="addRub" style="max-width:520px"><input name="name" required placeholder="Nuevo criterio de la rúbrica" aria-label="Nuevo criterio de la rúbrica" style="flex:1"><button class="btn primary sm" type="submit">Agregar criterio</button></form>`;
  if (tab === 'config') body = `<form class="panel stack" data-form="config" style="max-width:560px">
    <label class="field">Tamaño máximo por archivo (MB)<input type="number" name="maxMB" min="1" max="100" required value="${D.config.maxMB}"></label>
    <label class="field">Formatos permitidos<input name="types" required value="${esc(D.config.types)}"><small>Separados por comas. El servidor vuelve a validar el tipo real del archivo.</small></label>
    <div><button class="btn primary sm" type="submit">Guardar configuración</button></div></form>`;
  if (tab === 'auditoria') body = `<ul class="audit">${D.audit.map(a => `<li><span class="muted">${fmtDate(a.date)} ${fmtTime(a.date)}</span><span><b>${esc(a.by)}</b>: ${esc(a.action)}</span></li>`).join('')}</ul>`;
  return `<main class="page"><div class="page-head"><div><h1>Administración</h1><p class="lead">Gestiona cuentas, categorías, simulaciones y contenidos de la plataforma.</p></div></div>
    <div class="tabs admin-tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-action="adminTab" data-tab="${k}">${l}</button>`).join('')}</div>
    ${body}
    <p class="muted small block">En producción, cada permiso se verifica en el servidor; esta pantalla solo muestra las opciones a las que el rol tiene acceso.</p></main>`;
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 2800); }

/* ---------- Enlace de datos ---------- */
const guards = {
  hyp(item, val){ if ((val === 'validada' || val === 'refutada') && !filled(item.result)) { toast('Registra el resultado obtenido antes de cambiar el estado.', true); return false; } return true; }
};
function bindValue(el){
  const p = cur(); if (!p) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.bind) setPath(p, el.dataset.bind, val);
  else if (el.dataset.coll) {
    const arr = getPath(p, el.dataset.coll) || [], it = arr.find(x => x.id === el.dataset.id);
    if (!it) return;
    if (el.dataset.guard && !guards[el.dataset.guard](it, val)) { el.value = getPath(it, el.dataset.field); return; }
    const v = el.dataset.field.startsWith('scores.') ? (val === '' ? '' : +val) : val;
    setPath(it, el.dataset.field, v);
  } else return;
  API.touch(p);
}
const timers = new WeakMap();
document.addEventListener('input', e => {
  const el = e.target;
  if (el.tagName === 'SELECT' || el.type === 'radio' || el.type === 'checkbox' || el.type === 'file') return;
  if (!el.dataset.bind && !el.dataset.coll) return;
  clearTimeout(timers.get(el));
  timers.set(el, setTimeout(() => bindValue(el), 450));
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.admin === 'role') {
    const u = Store.data.users.find(x => x.id === el.dataset.id); u.role = el.value; API.audit(`Cambió el rol de ${u.name} a ${ROLE_LABEL[u.role]}`); toast('Rol actualizado'); return;
  }
  if (!el.dataset.bind && !el.dataset.coll) return;
  clearTimeout(timers.get(el));
  bindValue(el);
  if (el.dataset.rerender) rerender();
});

/* ---------- Agregar elementos a colecciones ---------- */
const addHooks = {
  'dt.prototipar.versions'(o, f, p){ o.v = p.dt.prototipar.versions.reduce((m, v) => Math.max(m, v.v), 0) + 1; },
  'dt.idear.ideas'(o){ o.scores = {}; o.discarded = false; },
  'hypotheses'(o){ o.status = 'pendiente'; o.result = ''; },
  'activities'(o){ o.status = 'pendiente'; if (o.end < o.start) { toast('La fecha de fin no puede ser anterior a la de inicio.', true); return false; } },
  'validations'(o, f, p){
    if (o.copyResult && o.hypothesisId) { const h = p.hypotheses.find(x => x.id === o.hypothesisId); if (h) h.result = (h.result ? h.result + '\n' : '') + o.results; }
    delete o.copyResult;
    if (o.cost && isNaN(+o.cost.replace(',', '.'))) { toast('El costo debe ser un número.', true); return false; }
  },
  'evidences'(o, f){
    // En producción: el archivo se sube a almacenamiento privado (URL prefirmada) y aquí solo se guardan los metadatos.
    const file = f.querySelector('input[type=file]').files[0], cfg = Store.data.config;
    if (!file) { toast('Elige un archivo.', true); return false; }
    const ext = file.name.split('.').pop().toLowerCase(), allowed = cfg.types.split(',').map(x => x.trim().toLowerCase());
    if (!allowed.includes(ext)) { toast(`El formato .${ext} no está permitido.`, true); return false; }
    if (file.size > cfg.maxMB * 1048576) { toast(`El archivo supera el máximo de ${cfg.maxMB} MB.`, true); return false; }
    Object.assign(o, {fileName:file.name, size:file.size, mime:file.type, date:nowISO()});
    delete o.file; S.prefill = null;
  }
};
function addItem(f){
  const p = cur(); if (!p) return;
  if (!f.checkValidity()) { f.reportValidity(); return; }
  const coll = f.dataset.add, fd = new FormData(f);
  const o = {id:uid('i'), createdAt:nowISO(), author:me().name};
  for (const [k, v] of fd.entries()) { if (typeof v === 'string') o[k] = v.trim(); }
  f.querySelectorAll('input[type=checkbox]').forEach(c => o[c.name] = c.checked);
  if (addHooks[coll] && addHooks[coll](o, f, p) === false) return;
  getPath(p, coll).push(o);
  API.touch(p); toast(f.dataset.msg || 'Guardado'); rerender();
}

/* ---------- Formularios con lógica propia ---------- */
const forms = {
  login(f){
    const email = f.elements.email.value.trim().toLowerCase();
    const u = Store.data.users.find(x => x.email.toLowerCase() === email);
    if (!email) return toast('Escribe tu correo.', true);
    if (!u) return toast('No encontramos una cuenta con ese correo.', true);
    if (!u.active) return toast('Tu cuenta está desactivada. Consulta con la administración.', true);
    loginAs(u.id);
  },
  newProject(f){
    if (!f.checkValidity()) return f.reportValidity();
    const p = API.create({name:f.elements.name.value.trim(), category:f.elements.category.value, description:f.elements.description.value.trim()});
    $('#dlgNew').close(); S.projectId = p.id; S.section = 'preparacion'; toast('Proyecto creado'); render();
  },
  addCrit(f){ const p = cur(); p.dt.idear.criteria.push({id:uid('c'), name:f.elements.name.value.trim()}); API.touch(p); rerender(); },
  simConclude(f){
    const idx = +new FormData(f).get('c'); if (isNaN(idx) || f.elements.c.value === '') return toast('Elige una conclusión.', true);
    const sc = SCENARIOS.find(s => s.id === S.sim.scenarioId), c = sc.conclusions[idx];
    const items = S.sim.asked.map(a => { const q = sc.chars.find(x => x.id === a.c).qs[a.q]; return {q:q.q, kind:q.kind, fb:q.fb, pts:q.pts, a:q.a, who:sc.chars.find(x => x.id === a.c).name}; });
    const diversity = new Set(S.sim.asked.map(a => a.c)).size === sc.chars.length;
    const score = items.reduce((s, i) => s + i.pts, 0) + (diversity ? 2 : 0) + c.pts;
    const best = sc.chars.flatMap(ch => ch.qs.map(q => q.pts)).sort((a, b) => b - a).slice(0, sc.maxQ).reduce((s, n) => s + n, 0) + 2 + Math.max(...sc.conclusions.map(x => x.pts));
    S.sim.result = {items, diversity, score, max:best, conclusion:c.text, cfb:c.fb, correct:c.pts === Math.max(...sc.conclusions.map(x => x.pts))};
    S.sim.phase = 'result'; rerender();
  },
  simSave(f){
    const p = cur(), r = S.sim.result, sc = SCENARIOS.find(s => s.id === S.sim.scenarioId);
    p.simulations.push({id:uid('sm'), scenarioId:sc.id, title:sc.title, date:nowISO(), score:r.score, max:r.max, conclusion:r.conclusion, correct:r.correct, reflection:f.elements.reflection.value.trim()});
    if (f.elements.copy.checked) {
      p.dt.empatizar.records.push({id:uid('e'), date:today(), type:'Entrevista', origin:'simulada', person:'Perfiles simulados: ' + [...new Set(r.items.map(i => i.who))].join(', '), findings:r.items.map(i => `${i.who}: ${i.a}`).join(' '), author:me().name});
    }
    S.sim = null; API.touch(p); toast('Resultado de la práctica guardado'); rerender();
  },
  comment(f){
    if (!f.checkValidity()) return f.reportValidity();
    const p = API.get(S.reviewId);
    p.comments.push({id:uid('cm'), by:me().id, byName:me().name, stage:f.elements.stage.value, text:f.elements.text.value.trim(), date:nowISO()});
    Store.save(); toast('Comentario enviado'); rerender();
  },
  evaluate(f){
    if (!f.checkValidity()) return f.reportValidity();
    const p = API.get(S.reviewId), scores = {};
    Store.data.rubric.forEach(r => scores[r.id] = +f.elements[r.id].value);
    p.evaluations.push({id:uid('ev'), teacherId:me().id, teacherName:me().name, date:nowISO(), scores, notes:f.elements.notes.value.trim()});
    Store.save(); toast('Evaluación guardada'); rerender();
  },
  addUser(f){
    if (!f.checkValidity()) return f.reportValidity();
    const email = f.elements.email.value.trim().toLowerCase();
    if (Store.data.users.some(u => u.email.toLowerCase() === email)) return toast('Ya existe una cuenta con ese correo.', true);
    const u = {id:uid('u'), name:f.elements.name.value.trim(), email, role:f.elements.role.value, active:true};
    Store.data.users.push(u); API.audit(`Creó la cuenta de ${u.name} con rol ${ROLE_LABEL[u.role]}`); toast('Cuenta creada'); rerender();
  },
  addCat(f){ const n = f.elements.name.value.trim(); if (Store.data.categories.some(c => c.name.toLowerCase() === n.toLowerCase())) return toast('Esa categoría ya existe.', true); Store.data.categories.push({id:uid('k'), name:n, active:true}); API.audit(`Creó la categoría «${n}»`); rerender(); },
  addCheck(f){ Store.data.checklist.push({id:uid('ev'), name:f.elements.name.value.trim(), stage:f.elements.stage.value}); API.audit(`Agregó la evidencia requerida «${f.elements.name.value.trim()}»`); rerender(); },
  addRub(f){ Store.data.rubric.push({id:uid('r'), name:f.elements.name.value.trim()}); API.audit(`Agregó el criterio de rúbrica «${f.elements.name.value.trim()}»`); rerender(); },
  config(f){ Store.data.config = {maxMB:+f.elements.maxMB.value, types:f.elements.types.value.trim()}; API.audit(`Cambió los límites de archivos: ${f.elements.maxMB.value} MB, ${f.elements.types.value.trim()}`); toast('Configuración guardada'); rerender(); }
};
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.add) { e.preventDefault(); addItem(f); }
  else if (f.dataset.form && forms[f.dataset.form]) { e.preventDefault(); forms[f.dataset.form](f); }
});

/* ---------- Acciones ---------- */
function loginAs(id){ S.userId = id; Session.set(id); S.projectId = null; S.reviewId = null; S.section = 'resumen'; S.sim = null; render(); }
const actions = {
  loginAs:t => loginAs(t.dataset.id),
  logout:() => { S.userId = null; Session.set(null); S.projectId = null; S.lastSave = null; render(); },
  forgot:() => toast('Si el correo está registrado, recibirás un enlace para crear una nueva contraseña.'),
  resetDemo:() => { if (confirm('¿Restablecer todos los datos de la demo?')) { Store.reset(); toast('Datos restablecidos'); render(); } },
  theme:() => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('lve-theme', r.dataset.theme); } catch (e) {} },
  home:() => { S.projectId = null; S.reviewId = null; S.sim = null; render(); },
  openNew:() => $('#dlgNew').showModal(),
  closeNew:() => $('#dlgNew').close(),
  openProject:t => { S.projectId = t.dataset.id; S.section = 'resumen'; render(); },
  go:t => { S.section = t.dataset.sec; render(); },
  dtTab:t => { S.dtTab = t.dataset.tab; rerender(); },
  del:t => {
    if (!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) return;
    const p = cur(), arr = getPath(p, t.dataset.coll), i = arr.findIndex(x => x.id === t.dataset.id);
    if (i > -1) arr.splice(i, 1);
    if (t.dataset.coll === 'hypotheses') p.validations.forEach(v => { if (v.hypothesisId === t.dataset.id) v.hypothesisId = ''; });
    API.touch(p); toast('Registro eliminado'); rerender();
  },
  delCrit:t => { const p = cur(), c = p.dt.idear.criteria; if (c.length <= 1) return toast('Debe quedar al menos un criterio.', true); c.splice(c.findIndex(x => x.id === t.dataset.id), 1); API.touch(p); rerender(); },
  discard:t => { const p = cur(); p.dt.idear.ideas.find(x => x.id === t.dataset.id).discarded = true; API.touch(p); toast('Idea descartada. La encontrarás al final.'); rerender(); },
  restore:t => { const p = cur(); p.dt.idear.ideas.find(x => x.id === t.dataset.id).discarded = false; API.touch(p); rerender(); },
  snapshot:t => { const p = cur(); getPath(p, t.dataset.dst).push({id:uid('vs'), date:nowISO(), data:JSON.parse(JSON.stringify(getPath(p, t.dataset.src)))}); API.touch(p); toast('Versión guardada'); rerender(); },
  attachFor:t => { S.prefill = {stage:t.dataset.stage, req:t.dataset.req, title:t.dataset.title}; S.section = 'evidencias'; render(); },
  download:() => toast('En producción se descarga el archivo desde el almacenamiento privado.'),
  print:() => window.print(),
  simStart:t => { S.sim = {scenarioId:t.dataset.id, phase:'interview', asked:[], char:null}; rerender(); },
  simChar:t => { S.sim.char = t.dataset.id; rerender(); },
  simAsk:t => { S.sim.asked.push({c:S.sim.char, q:+t.dataset.q}); rerender(); },
  simToConclude:() => { S.sim.phase = 'conclude'; rerender(); },
  simBack:() => { S.sim.phase = 'interview'; rerender(); },
  simCancel:() => { S.sim = null; rerender(); },
  review:t => { S.reviewId = t.dataset.id || null; render(); },
  adminTab:t => { S.adminTab = t.dataset.tab; rerender(); },
  toggleUser:t => { const u = Store.data.users.find(x => x.id === t.dataset.id); u.active = !u.active; API.audit(`${u.active ? 'Activó' : 'Desactivó'} la cuenta de ${u.name}`); rerender(); },
  toggleCat:t => { const c = Store.data.categories.find(x => x.id === t.dataset.id); c.active = !c.active; API.audit(`${c.active ? 'Activó' : 'Desactivó'} la categoría «${c.name}»`); rerender(); },
  toggleScen:t => { let s = Store.data.scenarios.find(x => x.id === t.dataset.id); if (!s) { s = {id:t.dataset.id, active:false}; Store.data.scenarios.push(s); } s.active = !s.active; API.audit(`${s.active ? 'Activó' : 'Desactivó'} el escenario «${SCENARIOS.find(x => x.id === s.id).title}»`); rerender(); },
  delCheck:t => { const l = Store.data.checklist, c = l.find(x => x.id === t.dataset.id); l.splice(l.indexOf(c), 1); API.audit(`Quitó la evidencia requerida «${c.name}»`); rerender(); },
  delRub:t => { const l = Store.data.rubric, c = l.find(x => x.id === t.dataset.id); if (l.length <= 1) return toast('La rúbrica necesita al menos un criterio.', true); l.splice(l.indexOf(c), 1); API.audit(`Quitó el criterio de rúbrica «${c.name}»`); rerender(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t || !actions[t.dataset.action]) return;
  e.preventDefault(); actions[t.dataset.action](t, e);
});

/* ---------- Inicio ---------- */
try { const th = localStorage.getItem('lve-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
Store.load();
S.userId = Session.get();
render();
</script>
